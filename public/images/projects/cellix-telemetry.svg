<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <rect width="1200" height="750" fill="#08080A"/>

  <!-- Header -->
  <rect x="40" y="32" width="1120" height="68" rx="12" fill="#111115" stroke="#292929"/>
  <text x="68" y="62" fill="#FF304F" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2">SERVER-AUTHORITATIVE ARCHITECTURE &amp; LEADERBOARD TELEMETRY</text>
  <text x="68" y="84" fill="#F5F3EF" font-family="sans-serif" font-size="20" font-weight="700">20 TPS Game Server • WebSockets • Prisma Composite Indexing • Redis</text>

  <!-- 3 Architectural Columns -->
  <!-- Column 1: Client & Engine -->
  <g transform="translate(40, 128)">
    <rect width="346" height="420" rx="16" fill="#111116" stroke="#292929"/>
    <text x="28" y="40" fill="#D4AF72" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2">01 // CLIENT RUNTIME</text>
    <text x="28" y="68" fill="#F5F3EF" font-family="sans-serif" font-size="19" font-weight="700">Next.js + React 19 + Phaser 3</text>
    
    <rect x="28" y="96" width="290" height="68" rx="10" fill="#17171D" stroke="#292929"/>
    <text x="44" y="124" fill="#F5F3EF" font-family="monospace" font-size="12" font-weight="700">App Router &amp; Turbopack</text>
    <text x="44" y="146" fill="#929292" font-family="monospace" font-size="11">UZ/EN i18n, Hub, Profile, Armory</text>

    <rect x="28" y="180" width="290" height="68" rx="10" fill="#17171D" stroke="#292929"/>
    <text x="44" y="208" fill="#F5F3EF" font-family="monospace" font-size="12" font-weight="700">Phaser 3 WebGL / Canvas</text>
    <text x="44" y="230" fill="#929292" font-family="monospace" font-size="11">Main, Survival, Practice, Multiplayer</text>

    <rect x="28" y="264" width="290" height="68" rx="10" fill="#17171D" stroke="#292929"/>
    <text x="44" y="292" fill="#F5F3EF" font-family="monospace" font-size="12" font-weight="700">Web Audio API + Framer Motion</text>
    <text x="44" y="314" fill="#929292" font-family="monospace" font-size="11">Procedural SFX &amp; HUD transitions</text>

    <rect x="28" y="348" width="290" height="48" rx="10" fill="#1D1610" stroke="#D4AF72" stroke-opacity="0.4"/>
    <text x="44" y="376" fill="#D4AF72" font-family="monospace" font-size="11" font-weight="700">PWA Manifest + Service Worker</text>
  </g>

  <!-- Column 2: Authoritative Server & Security -->
  <g transform="translate(427, 128)">
    <rect width="346" height="420" rx="16" fill="#130E12" stroke="#FF304F" stroke-opacity="0.5"/>
    <text x="28" y="40" fill="#FF304F" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2">02 // AUTHORITATIVE SERVER</text>
    <text x="28" y="68" fill="#F5F3EF" font-family="sans-serif" font-size="19" font-weight="700">WebSockets &amp; Run-Token Auth</text>

    <rect x="28" y="96" width="290" height="68" rx="10" fill="#1B1218" stroke="#FF304F" stroke-opacity="0.35"/>
    <text x="44" y="124" fill="#FF304F" font-family="monospace" font-size="12" font-weight="700">20 TPS Game Server &amp; WS</text>
    <text x="44" y="146" fill="#929292" font-family="monospace" font-size="11">Real-time state sync &amp; tick validation</text>

    <rect x="28" y="180" width="290" height="68" rx="10" fill="#17171D" stroke="#292929"/>
    <text x="44" y="208" fill="#F5F3EF" font-family="monospace" font-size="12" font-weight="700">Single-Use RunSession Token</text>
    <text x="44" y="230" fill="#929292" font-family="monospace" font-size="11">30-min TTL anti-replay protection</text>

    <rect x="28" y="264" width="290" height="68" rx="10" fill="#17171D" stroke="#292929"/>
    <text x="44" y="292" fill="#F5F3EF" font-family="monospace" font-size="12" font-weight="700">PBKDF2 Cryptographic Auth</text>
    <text x="44" y="314" fill="#929292" font-family="monospace" font-size="11">100,000 iterations • SHA-512 • 64B</text>

    <rect x="28" y="348" width="290" height="48" rx="10" fill="#17171D" stroke="#292929"/>
    <text x="44" y="376" fill="#F5F3EF" font-family="monospace" font-size="11" font-weight="700">RateLimitBucket API Guard</text>
  </g>

  <!-- Column 3: Data & Caching Layer -->
  <g transform="translate(814, 128)">
    <rect width="346" height="420" rx="16" fill="#111116" stroke="#292929"/>
    <text x="28" y="40" fill="#D4AF72" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2">03 // DATA &amp; PERSISTENCE</text>
    <text x="28" y="68" fill="#F5F3EF" font-family="sans-serif" font-size="19" font-weight="700">PostgreSQL + Prisma + Redis</text>

    <rect x="28" y="96" width="290" height="68" rx="10" fill="#17171D" stroke="#292929"/>
    <text x="44" y="124" fill="#F5F3EF" font-family="monospace" font-size="12" font-weight="700">PostgreSQL (Neon) &amp; Prisma</text>
    <text x="44" y="146" fill="#929292" font-family="monospace" font-size="11">Composite Indexing &amp; Aggregations</text>

    <rect x="28" y="180" width="290" height="68" rx="10" fill="#17171D" stroke="#292929"/>
    <text x="44" y="208" fill="#F5F3EF" font-family="monospace" font-size="12" font-weight="700">Redis In-Memory Layer</text>
    <text x="44" y="230" fill="#929292" font-family="monospace" font-size="11">Low-latency leaderboard &amp; state</text>

    <rect x="28" y="264" width="290" height="68" rx="10" fill="#17171D" stroke="#292929"/>
    <text x="44" y="292" fill="#F5F3EF" font-family="monospace" font-size="12" font-weight="700">8 Relational Prisma Models</text>
    <text x="44" y="314" fill="#929292" font-family="monospace" font-size="11">Player, GameRun, HighScore, Daily...</text>

    <rect x="28" y="348" width="290" height="48" rx="10" fill="#1D1610" stroke="#D4AF72" stroke-opacity="0.4"/>
    <text x="44" y="376" fill="#D4AF72" font-family="monospace" font-size="11" font-weight="700">Deterministic Daily Challenge Seed</text>
  </g>

  <!-- Bottom REST API Endpoint Strip -->
  <rect x="40" y="576" width="1120" height="126" rx="14" fill="#111115" stroke="#292929"/>
  <text x="68" y="610" fill="#D4AF72" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2">VERIFIED REST API ENDPOINT TOPOLOGY</text>
  <text x="68" y="642" fill="#F5F3EF" font-family="monospace" font-size="12">POST /api/game/run/start   →   POST /api/game/score   →   GET /api/game/leaderboard</text>
  <text x="68" y="672" fill="#929292" font-family="monospace" font-size="12">POST /api/auth/register • POST /api/auth/login • GET /api/economy • POST /api/economy/purchase • PUT /api/profile/[id]</text>
</svg>
